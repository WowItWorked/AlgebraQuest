<title>Algebra Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a chunky sandbox-game HUD. Sky-blue ground, white block panels, hard 3px edges with a 4px "block" drop, display face for headlines only. */
:root{
  --bg:#dceefc; --bg2:#c4e0f7; --panel:#ffffff; --panel2:#f1f6fb; --ink:#1d2733; --muted:#5a6b7d; --line:#9db3c8; --shadow:#6f8aa5;
  --accent:#6b3df5; --accent-ink:#ffffff; --gold:#f5b800; --gold-ink:#3b2a00; --grass:#5bc236; --dirt:#a4683a; --ok:#1f9d47; --ok-bg:#dff7e5; --bad:#d8383e; --bad-bg:#ffe3e4; --warn:#c77a00; --warn-bg:#fff1d6;
  --l1:#2aa7e8; --l2:#2fb37a; --l3:#f0612f; --l4:#8e4ff0; --l5:#e23c7f; --l6:#1b9fa8;
  --disp:'Bungee','Arial Black',Impact,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r:8px;
}
/* Always light by choice. The dark palette is kept here, commented out, in case it is wanted later:
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141b2a; --bg2:#0f1521; --panel:#1f2838; --panel2:#283446; --ink:#edf2f8; --muted:#a5b4c6; --line:#4a5b73; --shadow:#0a0f18;
  --accent:#9b7bff; --accent-ink:#120a2e; --gold:#ffcb3d; --gold-ink:#2a1d00; --grass:#4caf32; --dirt:#8a5630; --ok:#5fd37f; --ok-bg:#1d3b28; --bad:#ff7a7f; --bad-bg:#4a2024; --warn:#ffb648; --warn-bg:#3f3015;
  --l1:#4fbcf5; --l2:#4fcf96; --l3:#ff7d4d; --l4:#ab7cff; --l5:#ff6aa3; --l6:#3fc2cc;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141b2a; --bg2:#0f1521; --panel:#1f2838; --panel2:#283446; --ink:#edf2f8; --muted:#a5b4c6; --line:#4a5b73; --shadow:#0a0f18;
  --accent:#9b7bff; --accent-ink:#120a2e; --gold:#ffcb3d; --gold-ink:#2a1d00; --grass:#4caf32; --dirt:#8a5630; --ok:#5fd37f; --ok-bg:#1d3b28; --bad:#ff7a7f; --bad-bg:#4a2024; --warn:#ffb648; --warn-bg:#3f3015;
  --l1:#4fbcf5; --l2:#4fcf96; --l3:#ff7d4d; --l4:#ab7cff; --l5:#ff6aa3; --l6:#3fc2cc;
  color-scheme:dark; }
*/
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;font-weight:600;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.1;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.4rem)} h2{font-size:clamp(1.25rem,3vw,1.7rem)} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit}
.num,.coins,.score,.tab{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:3px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-size:1.15rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo .cube{width:22px;height:22px;background:var(--grass);border:3px solid var(--ink);box-shadow:inset -5px -5px 0 var(--dirt)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:.95rem}
.pill.badges{background:var(--panel2);color:var(--ink)}
.coin{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);display:inline-block}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:3px solid var(--ink);background:var(--panel2);color:var(--ink);padding:6px 12px;border-radius:var(--r);font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tab.fs{padding:6px 10px;font-size:1.05rem;line-height:1}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
main{flex:1}
main .wrap{padding-block:22px 40px}
/* Blocks */
.block{background:var(--panel);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--shadow);padding:18px}
.block+.block,.stack>*+*{margin-top:18px}
.block.soft{background:var(--panel2);box-shadow:none}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:3px solid var(--ink);border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-decoration:none;user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--panel);color:var(--ink)} .btn.gold{background:var(--gold);color:var(--gold-ink)} .btn.ok{background:var(--ok);color:#fff} .btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent);padding-inline:6px;min-height:36px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
input[type=text],textarea{width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:10px 12px;border:3px solid var(--ink);border-radius:var(--r);background:var(--panel);color:var(--ink);min-width:0}
textarea{min-height:88px;resize:vertical}
.eq{font-weight:800;white-space:nowrap;padding:0 4px;background:var(--panel2);border-radius:4px;font-variant-numeric:tabular-nums}
.students{display:grid;gap:6px;margin-top:8px}
/* Portals (lobby) */
.portal{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--shadow);padding:16px;position:relative;overflow:hidden;min-width:0}
.portal:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.portal .band{height:14px;margin:-16px -16px 6px;background:var(--pc,var(--accent));border-bottom:3px solid var(--ink)}
.portal h3{font-size:1rem}
.portal .lvl{font-family:var(--disp);font-size:.8rem;color:var(--pc,var(--accent))}
.portal .prog{height:12px;background:var(--panel2);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.portal .prog i{display:block;height:100%;background:var(--pc,var(--accent))}
.portal.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
.portal.big .band{display:none}
.portal .done{position:absolute;top:10px;right:10px;background:var(--ok);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:900}
/* Obby course */
.course{position:relative;height:84px;margin:6px 0 2px}
.course svg{width:100%;height:100%;display:block;overflow:visible}
.avatar{position:absolute;bottom:26px;width:34px;height:46px;transition:left .9s ease-in-out;transform:translateX(-50%)}
.avatar.walk{animation:walk .3s infinite alternate} @keyframes walk{to{transform:translateX(-50%) translateY(-4px) rotate(3deg)}}
.avatar.hop{animation:hop .55s cubic-bezier(.3,1.4,.5,1)} @keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}45%{transform:translateX(-50%) translateY(-18px)}}
@media (prefers-reduced-motion:reduce){.avatar{transition:none;animation:none!important}}
.cp{font-size:.7rem;font-weight:900;text-anchor:middle;fill:var(--muted)}
/* Items */
.item{padding:14px;border:3px solid var(--line);border-radius:var(--r);background:var(--panel);display:grid;gap:10px}
.item.ok{border-color:var(--ok);background:var(--ok-bg)} .item.bad{border-color:var(--bad)}
.item .tag{font-family:var(--disp);font-size:.85rem;color:var(--accent);display:flex;gap:8px;align-items:center}
.item .tag .ck{color:var(--ok)}
.fb{padding:12px 14px;border-radius:var(--r);border:3px solid;font-weight:700}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)} .fb.warn{background:var(--warn-bg);border-color:var(--warn)} .fb.info{background:var(--panel2);border-color:var(--line)}
.fb .who{font-family:var(--disp);font-size:.75rem;display:block;margin-bottom:4px;opacity:.85}
.fb a{font-weight:900}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:3px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-weight:700}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--panel2);box-shadow:inset 4px 0 0 var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);background:var(--panel2);color:var(--ink);border-radius:var(--r);padding:8px 12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip[disabled]{opacity:.35;box-shadow:none;cursor:default}
.chip.sm{padding:4px 10px;font-size:.85rem;box-shadow:0 2px 0 var(--ink)} .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seq{min-height:48px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;border:3px dashed var(--line);border-radius:var(--r)}
.seq .chip{cursor:pointer}
/* Number line */
.nl{user-select:none;touch-action:none}
.nl svg{width:100%;height:auto;display:block;overflow:visible}
.nl .tick{stroke:var(--ink);stroke-width:2} .nl .lab{font-size:11px;font-weight:800;fill:var(--ink);text-anchor:middle;font-family:var(--body)}
.nl .shade{stroke:var(--accent);stroke-width:8;stroke-linecap:butt}
.nl .dot{stroke:var(--ink);stroke-width:3;cursor:grab} .nl .dot.open{fill:var(--panel)} .nl .dot.closed{fill:var(--accent)}
/* Keypad, scratch, examples, problem nav, daily */
.kp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.key{min-width:42px;min-height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:6px;background:var(--panel2);color:var(--ink);font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(2px);box-shadow:none}
.scratch{min-height:64px;font-size:.95rem;background:var(--panel2)}
.ex{margin-top:4px;border-color:var(--line);background:var(--panel2)} .ex summary{font-family:var(--body);font-size:.9rem;color:var(--accent)} .exsteps{margin:0;padding-left:22px;display:grid;gap:6px;font-size:.95rem}
.pnav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px;border:3px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:800;font-size:.8rem;line-height:1.2}
.pbtn b{font-family:var(--disp);font-size:1.05rem} .pbtn.cur{border-color:var(--accent);background:var(--panel2);box-shadow:0 3px 0 var(--accent)} .pbtn.done{border-color:var(--ok)} .pbtn.done b{color:var(--ok)}
.daily{display:flex;gap:24px;flex-wrap:wrap;padding:12px 14px;border:3px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);display:inline-block} .dot.on{background:var(--gold)}
.stage.mini{min-height:132px} .stage.mini .char .face{width:40px;height:40px;font-size:1rem} .stage.mini .board{font-size:1.05rem;padding:6px 10px} .stage.mini .char{bottom:24%}
/* World map */
.mapblock{padding:10px}
.map{position:relative;width:100%;aspect-ratio:10/9;max-width:100%;border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#7bc95b}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-weight:900}
.stop .mk{width:40px;height:40px;border:3px solid var(--ink);border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:1.05rem;box-shadow:0 4px 0 var(--ink);transition:transform .15s}
.stop:hover .mk,.stop:focus-visible .mk{transform:translateY(-3px)}
.stop .lb{font-size:.68rem;line-height:1.15;text-align:center;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:6px;padding:2px 6px;max-width:120px;color:var(--ink)}
.stop .lb i{font-style:normal;color:var(--muted);font-weight:700}
.stop.soon .mk{background:#b9c3cf;color:#4a5b73;box-shadow:0 3px 0 #4a5b73} .stop.soon .lb{opacity:.85}
.stop.here .mk{outline:3px solid var(--accent);outline-offset:2px} .stop.clear .mk{background:var(--ok);color:#fff}
.mapav{position:absolute;width:30px;height:40px;transform:translate(-50%,-110%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
@media (max-width:560px){ .stop .mk{width:32px;height:32px;font-size:.9rem} .stop .lb{font-size:.58rem;max-width:92px} .mapav{width:24px;height:32px} }
/* Shop, journal, read-aloud */
.avprev{width:110px;height:120px} .avprev svg{width:100%;height:100%}
.shopgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-top:10px}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:3px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:800;font-size:.9rem}
.shopitem .ico{font-size:1.8rem} .shopitem.own{border-color:var(--ok)} .shopitem.eq{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)} .shopitem[disabled]{opacity:.5;cursor:not-allowed}
.jentry{padding:10px 12px;border:2px solid var(--line);border-radius:var(--r);display:grid;gap:6px}
.ra{margin-left:auto;border:2px solid var(--ink);background:var(--panel2);border-radius:6px;min-width:34px;min-height:30px;cursor:pointer;font-size:.95rem;line-height:1} .ra.on{background:var(--gold)}
.nlstatic{width:100%;max-width:520px;height:auto;display:block;margin:8px 0}
/* Toasts & modals */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);border:3px solid var(--gold);border-radius:var(--r);padding:8px 14px;font-weight:900;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .block{max-width:460px;width:100%}
footer .wrap{padding-block:14px 24px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem}
.glyph{background:none;border:0;color:var(--line);cursor:pointer;font-size:.9rem;padding:6px;opacity:.6}
/* Learn / scenes */
.stage{position:relative;background:linear-gradient(var(--bg),var(--bg2) 70%,var(--grass) 70%,var(--grass) 78%,var(--dirt) 78%);border:3px solid var(--ink);border-radius:var(--r);min-height:260px;overflow:hidden;padding:14px}
.stage .board{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:3px solid var(--ink);border-radius:var(--r);padding:10px 16px;font-size:clamp(1.1rem,3.5vw,1.6rem);font-weight:900;font-variant-numeric:tabular-nums;max-width:calc(100% - 28px);text-align:center;transition:transform .3s;box-shadow:0 4px 0 var(--shadow)}
.stage .board.shake{animation:shake .5s} @keyframes shake{20%{transform:translateX(-50%) rotate(-3deg)}40%{transform:translateX(-50%) rotate(3deg)}60%{transform:translateX(-50%) rotate(-2deg)}80%{transform:translateX(-50%) rotate(2deg)}}
.stage .board .hl{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 4px}
.stage .board .bad{color:var(--bad);text-decoration:line-through}
.stage .char{position:absolute;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:4px;transition:left .5s,right .5s,transform .3s}
.stage .char .face{width:56px;height:56px;border:3px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:900;font-size:1.5rem;box-shadow:0 4px 0 var(--shadow)}
.stage .char .nm{font-size:.7rem;font-weight:900;background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:0 6px}
.stage .char.talk .face{animation:bob .6s infinite alternate} @keyframes bob{to{transform:translateY(-6px)}}
.stage .char.flip .face{animation:spin .8s} @keyframes spin{to{transform:rotateY(360deg)}}
.chat{display:grid;gap:8px;max-height:min(46vh,360px);overflow-y:auto;padding:10px;border:3px solid var(--ink);border-radius:var(--r);background:var(--panel2);margin-top:10px;scroll-behavior:smooth}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.msg.r{grid-template-columns:1fr 34px} .msg.r .av{order:2} .msg.r .bub{order:1;border-color:var(--accent)}
.msg .av{width:32px;height:32px;border:2px solid var(--ink);border-radius:5px;font-family:var(--body);font-weight:900;font-size:.95rem;display:flex;align-items:center;justify-content:center;margin-top:4px}
.msg .bub{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;animation:pop .25s}
.msg .nm{font-size:.68rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block}
.msg .say{font-weight:700}
.msg .mth{margin-top:6px;font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:3px 10px;display:block;width:max-content;max-width:100%;overflow-wrap:anywhere}
.msg .mth .hl{background:var(--gold);color:var(--gold-ink);border-radius:4px;padding:0 4px} .msg .mth .bad{color:var(--bad);text-decoration:line-through}
.msg.now .bub{border-color:var(--ink);box-shadow:0 3px 0 var(--shadow)}
.stage{min-height:200px}
.cap{min-height:3.2em;padding:10px 14px;border:3px solid var(--ink);border-radius:var(--r);background:var(--panel);font-weight:800;font-size:1.05rem;margin-top:10px}
.cap b{color:var(--accent)}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.vbar .prog{flex:1;min-width:120px;height:10px;border:2px solid var(--ink);border-radius:6px;background:var(--panel2);overflow:hidden} .vbar .prog i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps .tab{font-size:.85rem;padding:5px 10px}
.steps .tab.done{background:var(--ok-bg)}
.scale{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
.scale .pan{border:3px solid var(--ink);border-radius:var(--r);background:var(--panel2);padding:12px;min-height:60px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.scale .pan.tilt{animation:shake .5s}
.bucket{border:3px dashed var(--line);border-radius:var(--r);padding:10px;min-height:70px;display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start}
.bucket.hot{border-color:var(--accent);background:var(--panel2)}
.bucket h3{width:100%;font-size:1.3rem}
.kw{border:3px solid var(--ink);background:var(--gold);color:var(--gold-ink);border-radius:var(--r);padding:6px 10px;font-weight:900;cursor:grab;box-shadow:0 3px 0 var(--ink)}
.kw.sel{outline:3px solid var(--accent)}

/* ===== Math engine: parse, evaluate, compare ===== */
const M = (() => {
  const UNI = [[/≤/g,'<='],[/≥/g,'>='],[/[×·•]/g,'*'],[/÷/g,'/'],[/[−–—]/g,'-'],[/½/g,'(1/2)'],[/¼/g,'(1/4)'],[/¾/g,'(3/4)'],[/⅓/g,'(1/3)'],[/⅔/g,'(2/3)'],[/²/g,'^2'],[/³/g,'^3'],[/\$/g,''],[/\*\*/g,'^'],[/\[/g,'('],[/\]/g,')'],[/\{/g,'('],[/\}/g,')']];
  function clean(s){
    s = String(s||'').trim().toLowerCase();
    for (const [a,b] of UNI) s = s.replace(a,b);
    s = s.replace(/(\d),(\d{3})(?!\d)/g,'$1$2');   // 1,600 -> 1600
    s = s.replace(/=<|=</g,'<=').replace(/=>/g,'>=').replace(/==/g,'=');

  }
  function tokenize(s){
    const t=[]; let i=0;
    while(i<s.length){
      const c=s[i];
      if(/\s/.test(c)){i++;continue;}

      if(/[a-z]/.test(c)){ t.push({k:'v',v:c}); i++; continue; }

      if(c==='='){ t.push({k:'c',v:'='}); i++; continue; }
      if('+-*/^()'.includes(c)){ t.push({k:'o',v:c}); i++; continue; }
      throw new Error('bad char '+c);
    }
    return t;
  }
  // AST: {t:'n',v} {t:'v',v} {t:'op',op,a,b} {t:'neg',a} {t:'rel',parts:[expr...],ops:[...]}
  function parse(str){
    const tok = tokenize(clean(str)); let p=0;
    const peek=()=>tok[p], next=()=>tok[p++];
    function startsAtom(tk){ return tk && (tk.k==='n'||tk.k==='v'||(tk.k==='o'&&tk.v==='(')); }
    function atom(){
      const tk=next(); if(!tk) throw new Error('unexpected end');
      if(tk.k==='n') return {t:'n',v:tk.v};
      if(tk.k==='v') return {t:'v',v:tk.v};
      if(tk.k==='o'&&tk.v==='('){ const e=expr(); const cl=next(); if(!cl||cl.v!==')') throw new Error('missing )'); return e; }
      throw new Error('unexpected '+tk.v);
    }
    function power(){ let a=atom(); if(peek()&&peek().k==='o'&&peek().v==='^'){ next(); const b=unary(); a={t:'op',op:'^',a,b}; } return a; }
    function unary(){ if(peek()&&peek().k==='o'&&(peek().v==='-'||peek().v==='+')){ const s=next().v; const a=unary(); return s==='-'?{t:'neg',a}:a; } return power(); }
    function term(){
      let a=unary();
      for(;;){
        const tk=peek();
        if(tk&&tk.k==='o'&&(tk.v==='*'||tk.v==='/')){ next(); const b=unary(); a={t:'op',op:tk.v,a,b}; }
        else if(startsAtom(tk)){ const b=unary(); a={t:'op',op:'*',a,b}; } // implicit multiplication
        else break;
      }
      return a;
    }
    function expr(){
      let a=term();
      for(;;){ const tk=peek(); if(tk&&tk.k==='o'&&(tk.v==='+'||tk.v==='-')){ next(); const b=term(); a={t:'op',op:tk.v,a,b}; } else break; }
      return a;
    }
    function rel(){
      const parts=[expr()], ops=[];
      while(peek()&&peek().k==='c'){ ops.push(next().v); parts.push(expr()); }
      if(p<tok.length) throw new Error('trailing');
      return ops.length? {t:'rel',parts,ops} : parts[0];
    }
    return rel();
  }
  function ev(n,env){
    switch(n.t){
      case 'n': return n.v;
      case 'v': if(!(n.v in env)) throw new Error('unbound '+n.v); return env[n.v];

  function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

    const a=typeof A==='string'?tryParse(A):A, b=typeof B==='string'?tryParse(B):B;
    if(!a||!b||a.t==='rel'||b.t==='rel') return false;
    const vs=[...new Set([...vars(a),...vars(b)])]; const r=rng(1234); let good=0;

      if(!isFinite(x)||!isFinite(y)||Math.abs(x)>1e8||Math.abs(y)>1e8) continue;

  }
  // grid for truth sets: quarter steps near the action plus wider sweep
  function grid(){ const g=[]; for(let x=-40;x<=130;x+=0.25) g.push(x); for(let x=150;x<=1200;x+=37) g.push(x); g.push(-500,-120,2000); return g; }
  function relEquiv(A,B){
    if(typeof A==='string'&&typeof B==='string'&&/\b(or|and)\b/.test(clean(A)+' '+clean(B))) return setEquiv(A,B);
    const a=typeof A==='string'?tryParse(A):A, b=typeof B==='string'?tryParse(B):B;
    if(!a||!b||a.t!=='rel'||b.t!=='rel') return false;
    const va=[...vars(a)], vb=[...vars(b)];
    if(va.length!==vb.length||va.some(v=>!vb.includes(v))) return false;
    if(va.length===0){ return truth(a,{})===truth(b,{}); }
    if(va.length===1){ const v=va[0]; let n=0; for(const x of grid()){ const ta=truth(a,{[v]:x}), tb=truth(b,{[v]:x}); if(ta===null||tb===null) continue; if(ta!==tb) return false; n++; } return n>50; }
    const r=rng(99); let n=0;
    for(let i=0;i<400;i++){ const env={}; va.forEach(v=>env[v]=Math.round((r()*60-20)*4)/4); const ta=truth(a,env), tb=truth(b,env); if(ta===null||tb===null) continue; if(ta!==tb) return false; n++; }
    return n>100;
  }
  // numeric answer: "4.5", "4 1/2", "4½ hours", "-11", "7 jugs", "$36"
  function toNumber(s){
    s=clean(s); if(s.includes('=')) s=s.slice(s.lastIndexOf('=')+1);
    s=s.replace(/\b(hours?|hrs?|h|in|inches|jugs?|units?|total|at least|about|approximately|is|x|t|y|w|p)\b/g,' ').replace(/[a-z]/g,' ').trim();
    let m=s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/); if(m){ const v=+m[2]+ +m[3]/+m[4]; return m[1]?-v:v; }
    m=s.match(/^(-?)\s*(\d+)\s*\(1\/2\)$/); if(m){ const v=+m[2]+0.5; return m[1]?-v:v; }
    const t=tryParse(s); if(!t||t.t==='rel') return null;
    try{ const v=ev(t,{}); return isFinite(v)?v:null; }catch(e){ return null; }
  }
  function numEq(a,b,tol=1e-6){ return a!==null&&b!==null&&Math.abs(a-b)<=tol*Math.max(1,Math.abs(b)); }
  // solved-for check: returns {expr, status:'ok'|'not-solved'|'bad'}
  function solvedSide(str,v){
    const t=tryParse(str); if(!t) return {status:'bad'};
    if(t.t!=='rel') return vars(t).has(v)?{status:'not-solved',expr:t}:{status:'ok',expr:t};
    if(t.ops.length!==1||t.ops[0]!=='=') return {status:'bad'};
    const [L,R]=t.parts; const isBare=n=>n.t==='v'&&n.v===v;
    if(isBare(L)&&!vars(R).has(v)) return {status:'ok',expr:R};
    if(isBare(R)&&!vars(L).has(v)) return {status:'ok',expr:L};
    if(isBare(L)||isBare(R)) return {status:'circular',expr:isBare(L)?R:L};
    return {status:'not-solved',rel:t};
  }
  // Compound statements joined by the words "and" / "or" (either language or the symbols ∧ ∨ are not expected).
  function clauses(str){ const c=clean(str).replace(/\s*,\s*/g,' and '); const m=c.match(/\b(or|and)\b/); if(!m) return {op:null,parts:[c]}; const op=m[1]; const parts=c.split(new RegExp('\\b'+op+'\\b')).map(x=>x.trim()).filter(Boolean); if(c.includes(op==='or'?' and ':' or ')) return null; return {op,parts}; }
  function setFn(str){ const cl=clauses(str); if(!cl) return null; const rels=cl.parts.map(tryParse); if(rels.some(r=>!r||r.t!=='rel')) return null; const vs=new Set(); rels.forEach(r=>vars(r,vs)); if(vs.size!==1) return null; const v=[...vs][0];

  function setEquiv(A,B){ const a=setFn(A), b=setFn(B); if(!a||!b||a.v!==b.v) return false; let n=0; for(const x of grid()){ const ta=a.f(x), tb=b.f(x); if(ta===null||tb===null) continue; if(ta!==tb) return false; n++; } return n>50; }

  function hasOp(str,op){ const t=tryParse(str); return !!(t&&t.t==='rel'&&t.ops.includes(op)); }

  return {clean,parse,tryParse,ev,truth,vars,exprEquiv,relEquiv,clauses,setFn,setEquiv,toNumber,numEq,solvedSide,integers,hasOp,fmt,rng};
})();

let actx=null; function ding(){ if(State.s.muted) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.setValueAtTime(880,actx.currentTime); o.frequency.setValueAtTime(1320,actx.currentTime+.08); g.gain.setValueAtTime(.06,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.25); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.26);}catch(e){} }
function thud(){ if(State.s.muted) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(220,actx.currentTime); o.frequency.exponentialRampToValueAtTime(90,actx.currentTime+.2); g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.25); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.26);}catch(e){} }

function toast(msg){ const box=$('#toasts'); while(box.children.length>=3) box.firstChild.remove(); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; box.appendChild(t); setTimeout(()=>t.remove(),2600); }
function modal(html, actions){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="block" role="dialog" aria-modal="true"><div class="stack">${html}<div class="row" id="mact"></div></div></div>`; actions.forEach(a=>{ const b=document.createElement('button'); b.className='btn '+(a.cls||''); b.textContent=a.label; b.onclick=()=>{ m.remove(); a.fn&&a.fn(); }; $('#mact',m).appendChild(b); }); document.body.appendChild(m); return m; }

/* ---- avatar + course ---- */
function courseX(i,n){ return 8+(84*(i+1))/n; }
/* Walk the existing avatar to checkpoint `cleared` (1-based count), hop on arrival, recolor that flag. */
function moveAvatar(courseEl, cleared, n, color){
  const av=courseEl&&courseEl.querySelector('.avatar'); if(!av) return;
  const x= cleared===0?4:courseX(cleared-1,n); av.classList.add('walk'); av.style.left=x+'%';
  setTimeout(()=>{ av.classList.remove('walk'); av.classList.add('hop'); const flags=courseEl.querySelectorAll('svg rect'); const base=flags[0]; const k=cleared-1; if(flags[1+k*2]){ flags[1+k*2].setAttribute('fill','var(--ok)'); flags[2+k*2].setAttribute('fill',color); } const labs=courseEl.querySelectorAll('span'); if(labs[k]) labs[k].style.color='var(--ok)'; ding(); },950);
}
function courseHTML(checkpoints, clearedCount, color){
  // checkpoints: array of labels. avatar sits at index clearedCount (0 = start)
  const n=checkpoints.length; const xs=checkpoints.map((_,i)=>courseX(i,n));
  let svg=`<svg viewBox="0 0 100 40" preserveAspectRatio="none">`;
  svg+=`<rect x="0" y="30" width="100" height="10" fill="var(--grass)" stroke="var(--ink)" stroke-width=".6"/>`;
  xs.forEach((x,i)=>{ const done=i<clearedCount; svg+=`<rect x="${x-4}" y="${22-(i%2)*3}" width="8" height="${8+(i%2)*3}" fill="${done?'var(--ok)':'var(--dirt)'}" stroke="var(--ink)" stroke-width=".5"/><line x1="${x}" y1="${22-(i%2)*3}" x2="${x}" y2="${12-(i%2)*3}" stroke="var(--ink)" stroke-width=".6"/><rect x="${x}" y="${12-(i%2)*3}" width="6" height="4" fill="${done?color:'var(--line)'}" stroke="var(--ink)" stroke-width=".4"/>`; });
  svg+=`</svg>`;
  const ax = clearedCount===0? 4 : xs[Math.min(clearedCount,n)-1];
  const labels = checkpoints.map((c,i)=>`<span style="position:absolute;left:${xs[i]}%;transform:translateX(-50%);bottom:-2px;font-size:.68rem;font-weight:900;color:${i<clearedCount?'var(--ok)':'var(--muted)'};white-space:nowrap">${esc(c)}</span>`).join('');
  return `<div class="course" aria-hidden="true">${svg}<div class="avatar" style="left:${ax}%">${avatarSVG()}</div>${labels}</div>`;
}

/* ---- Scene player: captions + pre-rendered voice clips (voices/<id>.mp3) ---- */
let player=null;
function scenePlayer(host, frames, onEnd, lvl, opts={}){
  let i=Math.max(0,Math.min(frames.length-2,opts.start||0)), playing=false, timer=null, startedAt=0, left=0, ended=false;
  const id=k=>`${opts.prefix||''}l${lvl}-${String(k+1).padStart(2,'0')}`;
  const finish=()=>{ if(ended) return; ended=true; onEnd&&onEnd(); };
  const DUR=k=>Math.max(3800, 1800+(frames[k].say.length*52), ((typeof VOICE_DUR!=='undefined'&&VOICE_DUR[id(k)])||0)*1000+700);
  const audio=new Audio(); audio.preload='auto';
  host.innerHTML=`<div class="stage" aria-live="off"><div class="board" id="sb"></div><div class="char" id="cL" style="left:6%"></div><div class="char" id="cR" style="right:6%"></div></div><div class="chat" id="chat" aria-live="polite"></div><div class="vbar"><button class="btn sm" id="pp">⏸ Pause</button><button class="btn sm alt" id="pv" aria-label="Previous line">⏮</button><button class="btn sm alt" id="nx" aria-label="Next line">⏭</button><button class="btn sm alt" id="rp">↺ Replay</button><button class="btn sm alt" id="vo">${State.s.voice?'🔊 Voice on':'🔇 Voice off'}</button><div class="prog"><i id="pg" style="width:0%"></i></div><span class="muted num" id="fr"></span></div>`;
  const cL=$('#cL',host), cR=$('#cR',host), sb=$('#sb',host), chat=$('#chat',host); let shown=0;
  function addMsg(k){ const f=frames[k], c=CHARS[f.who]; const right=!(f.who==='coach'||f.who==='checker'||f.who==='bar'); chat.querySelectorAll('.msg.now').forEach(m=>m.classList.remove('now')); const m=document.createElement('div'); m.className='msg now'+(right?' r':''); m.innerHTML=`<div class="av" style="background:${c.bg};color:${c.fg}">${c.face}</div><div class="bub"><span class="nm">${c.nm}</span><span class="say">${f.say}</span>${f.board?`<div class="mth">${f.board}</div>`:''}</div>`; chat.appendChild(m); chat.scrollTop=chat.scrollHeight; }
  function setChar(el,who,talk){ const c=CHARS[who]; el.innerHTML=`<div class="face" style="background:${c.bg};color:${c.fg}">${c.face}</div><span class="nm">${c.nm}</span>`; el.classList.toggle('talk',!!talk); }
  function speak(k){ try{ audio.pause(); if(!State.s.voice) return; audio.src='voices/'+id(k)+'.mp3'; audio.currentTime=0; audio.play().catch(()=>{}); }catch(e){} }
  function show(){
    const f=frames[i]; const side = (f.who==='coach'||f.who==='checker'||f.who==='bar')?'L':'R';
    setChar(side==='L'?cL:cR, f.who, true); const other=side==='L'?cR:cL; if(!other.innerHTML) setChar(other, side==='L'?'vera':'coach', false); else other.classList.remove('talk');
    sb.innerHTML=f.board; sb.classList.remove('shake'); if(f.fx==='shake'){ void sb.offsetWidth; sb.classList.add('shake'); }
    const me=side==='L'?cL:cR; me.classList.remove('flip'); if(f.fx==='flip'||f.fx==='hop'){ void me.offsetWidth; me.classList.add('flip'); }
    if(i<shown){ chat.innerHTML=''; shown=0; } while(shown<=i){ addMsg(shown); shown++; } $('.stage',host).classList.toggle('mini',shown>=2); $('#fr',host).textContent=`${i+1}/${frames.length}`; $('#pg',host).style.width=Math.round(100*(i+1)/frames.length)+'%';
    speak(i); opts.onFrame&&opts.onFrame(i); if(i===frames.length-1) finish();
  }
  function schedule(ms){ clearTimeout(timer); startedAt=Date.now(); left=ms; timer=setTimeout(()=>{ if(i<frames.length-1){ i++; show(); schedule(DUR(i)); } else { playing=false; $('#pp',host).textContent='▶ Play'; finish(); } }, ms); }
  function jump(k){ i=Math.max(0,Math.min(frames.length-1,k)); left=0; show(); if(playing) schedule(DUR(i)); else { clearTimeout(timer); audio.pause(); } }
  function play(){ playing=true; $('#pp',host).textContent='⏸ Pause'; if(left>0&&left<DUR(i)){ schedule(left); if(State.s.voice) audio.play().catch(()=>{}); } else { show(); schedule(DUR(i)); } }
  function pause(){ playing=false; clearTimeout(timer); left=Math.max(0,left-(Date.now()-startedAt)); $('#pp',host).textContent='▶ Play'; try{ audio.pause(); }catch(e){} }
  $('#pp',host).onclick=()=>playing?pause():play();
  $('#rp',host).onclick=()=>{ pause(); i=0; left=0; play(); };
  $('#pv',host).onclick=()=>jump(i-1); $('#nx',host).onclick=()=>jump(i+1);
  $('#vo',host).onclick=()=>{ State.s.voice=!State.s.voice; State.save(); $('#vo',host).textContent=State.s.voice?'🔊 Voice on':'🔇 Voice off'; if(State.s.voice){ if(playing) speak(i); } else audio.pause(); };
  const stop=()=>{ pause(); audio.src=''; };
  if(i>0){ const n=document.createElement('p'); n.className='muted'; n.style.cssText='font-size:.85rem;margin-top:6px'; n.textContent=`Picking up where you left off (line ${i+1} of ${frames.length}). Tap Replay to start from the top.`; host.appendChild(n); }
  play(); return {stop};
}

  {n:2, label:'Lesson 1-2', tab:'1-2', title:'Solving Linear Equations', stem:'<b>Quick review:</b> use properties of equality to solve linear equations. Use the Distributive Property and combine like terms when needed.<br><b>Example:</b> <span class="eq">⅔(6x − 15) + 5x = 26</span> → 4x − 10 + 5x = 26 → 9x − 10 = 26 → 9x = 36 → x = 4.'},

  {n:4, label:'Lesson 1-4', tab:'1-4', title:'Literal Equations and Formulas', stem:'<b>Quick review:</b> use properties of equality to solve a literal equation for a specific variable, then use the rewritten formula.<br><b>Example:</b> cylinder volume <span class="eq">V = πr²h</span>, so <span class="eq">h = V/(πr²)</span>. With V = 1,650 cm³, r = 6 cm, and π ≈ 3.14: h = 1650/113.04 ≈ 14.60 cm.'},
  {n:5, label:'Lesson 1-5', tab:'1-5', title:'Solving Inequalities in One Variable', stem:'<b>Quick review:</b> the same strategies as multistep equations. When multiplying or dividing by a negative value, reverse the inequality symbol.<br><b>Example:</b> <span class="eq">−2(6x + 5) ≤ 74</span> → −12x − 10 ≤ 74 → −12x ≤ 84 → divide by −12 and reverse: x ≥ −7.'},
  {n:6, label:'Lesson 1-6', tab:'1-6', title:'Compound Inequalities', stem:'<b>Quick review:</b> with <b>and</b>, the solution must make both inequalities true. With <b>or</b>, it must make at least one true.<br><b>Example:</b> <span class="eq">−24 < 4x − 4 < 4</span> → −20 < 4x < 8 → −5 < x < 2.'},
];
const defs={2:['An equation rule for a relationship between two or more quantities is a(n) ___.',2],3:['A combination of two or more inequalities using the word <i>and</i> or the word <i>or</i> is a(n) ___.',0],4:['Any of the distinct objects of a set is called a(n) ___.',1],5:['If each element of B is also an element of A, B is a(n) ___ of A.',6],6:['A well-defined collection of elements is a(n) ___.',5],7:['An equation where letters are used for constants and variables is a(n) ___.',4],8:['An equation that is true for all values of the variable is a(n) ___.',3]};
const G=(hint1,hint2,first)=>({generic:[hint1,hint2],firstStep:first});
const R_ITEMS=[
  {id:'q1',p:1,skill:'vocab',learn:1,kind:'choice',explain:true,work:false,prompt:'<b>Essential question.</b> What general strategies can you use to solve simple equations and inequalities?',options:['Use properties of equality: do the same thing to both sides, distribute and combine like terms, and undo operations in reverse order. For inequalities, reverse the symbol when you multiply or divide by a negative.','Guess numbers until one makes the equation true.','Always divide first, then subtract, no matter what the equation looks like.','Move every term to the right side; the signs never change.'],correct:[0],rubric:'Use properties of equality (do the same operation to both sides), distribute and combine like terms, undo operations in reverse order, and for inequalities reverse the symbol when multiplying or dividing by a negative.',hints:[],...G('Think about what keeps an equation balanced, and what is different about inequalities.','Properties of equality keep both sides equal. Inequalities add one rule about negatives.','Balanced moves: whatever you do to one side, do to the other.')},
  ...[2,3,4,5,6,7,8].map(n=>({id:'v'+n,p:1,skill:'vocab',learn:1,kind:'choice',work:false,prompt:`<b>${n}.</b> ${defs[n][0]}`,options:VOCAB,correct:[defs[n][1]],hints:[],...G('Read the definition slowly and look for its key word: rule, and/or, object, collection, letters, true for all.','Match the key word: rule → formula, and/or → compound, object → element, part of a set → subset, collection → set, letters → literal, always true → identity.','Find the key word in the sentence.')})),
  {id:'q16',p:2,skill:'linear',learn:2,kind:'choice',explain:true,work:false,prompt:'<b>16. Use Structure.</b> What property would you use first to solve <span class="eq">½x − 6 = 10</span>? Explain.',options:['Addition Property of Equality: add 6 to both sides, so ½x = 16.','Division Property of Equality: divide both sides by ½ first.','Distributive Property: distribute the ½.','Subtraction Property of Equality: subtract 6 from both sides.'],correct:[0],rubric:'Addition Property of Equality: add 6 to both sides to undo the subtraction, giving ½x = 16; then multiply by 2.',hints:[],...G('Undo in reverse order: what was done to x last? Subtracting 6. What undoes subtracting?','Adding 6 to both sides undoes the − 6. That is the Addition Property of Equality.','Add 6 to both sides.')},
  {id:'q17',p:2,skill:'linear',learn:2,kind:'num',work:true,prompt:'<b>17.</b> Solve <span class="eq">3(2x − 1) = 21</span>.',answer:'4',placeholder:'x = …',hints:[{when:(r,H)=>H.num(11/3),text:'Did the 3 reach both terms inside the parentheses? 3 × 2x and 3 × (−1).'},{when:(r,H)=>H.num(10/3)||H.num(3),text:'After distributing, 6x − 3 = 21. Add 3 to both sides before dividing.'}],...G('Distribute the 3 to both terms, then undo the −3, then undo the ×6.','6x − 3 = 21 → 6x = 24.','Distribute: 6x − 3 = 21.')},
  {id:'q18',p:2,skill:'linear',learn:2,kind:'num',work:true,prompt:'<b>18.</b> Solve <span class="eq">100 = 8(4t − 5)</span>.',answer:'35/8',placeholder:'t = … (fraction or decimal)',hints:[{when:(r,H)=>H.num(105/32),text:'Distribute first: 8 × 4t = 32t and 8 × (−5) = −40. Then 100 = 32t − 40.'},{when:(r,H)=>H.num(60/32)||H.num(1.875),text:'Moving −40 to the left means adding 40: 140 = 32t.'}],...G('Distribute the 8, add 40 to both sides, divide by 32.','140 = 32t → t = 140/32, which simplifies.','Distribute: 100 = 32t − 40.')},
  {id:'q19',p:2,skill:'linear',learn:2,kind:'num',work:true,prompt:`<b>19.</b> Solve ${fr('5','8')} = ${fr('3','4')}b − ${fr('7','12')}.`,answer:'29/18',placeholder:'b = … (fraction)',hints:[{when:(r,H)=>H.num(1/18)||H.num(-1/18),text:'Undo the −7/12 by adding 7/12 to both sides. Common denominator 24: 15/24 + 14/24.'},{when:(r,H)=>H.num(29/24),text:'29/24 is ¾b, not b. Multiply both sides by 4/3.'}],...G('Add 7/12 to both sides (common denominator 24), then multiply by 4/3.','¾b = 29/24 → b = 29/24 × 4/3 = 29/18.','Add 7/12 to both sides: 29/24 = ¾b.')},
  {id:'q20',p:2,skill:'linear',learn:2,kind:'num',work:true,prompt:'<b>20.</b> Solve <span class="eq">1.045s + 0.068 = 15.743</span>.',answer:'15',placeholder:'s = …',hints:[{when:(r,H)=>H.num(15.13)||H.num(15.129),text:'Subtract 0.068 first: 15.743 − 0.068 = 15.675. Then divide by 1.045.'}],...G('Subtract 0.068 from both sides, then divide by 1.045.','1.045s = 15.675 → s = 15.','Subtract 0.068: 1.045s = 15.675.')},
  {id:'q21a',p:2,skill:'linear',learn:2,kind:'eqn',work:false,prompt:'<b>21. Model With Mathematics.</b> An adult movie ticket costs 1⅓ times a child ticket. Ines takes her daughter to the movie, buys popcorn for $5.50, and spends $26.50. Let <i>c</i> = the child ticket price. <b>Write the equation.</b>',answer:'c + (4/3)c + 5.5 = 26.5',placeholder:'c + … = 26.50',hints:[{when:(r,H)=>H.has(/1\s*1\/3|1\.33/),text:'1⅓ is the same as 4/3. The adult ticket is (4/3)c.'},{when:(r,H)=>!H.has(/5\.5|5\.50/),text:'Where is the popcorn? It is part of the $26.50 total.'}],...G('Two tickets plus popcorn equals the total: child + adult + 5.50 = 26.50, with adult = (4/3)c.','c + (4/3)c + 5.5 = 26.5.','Adult ticket = (4/3)c.')},
  {id:'q21b',p:2,skill:'linear',learn:2,kind:'num',work:true,prompt:'<b>21 (continued).</b> Solve your equation. What is the <b>child</b> ticket price (dollars)?',answer:'9',unit:'$',placeholder:'e.g. 9',hints:[{when:(r,H)=>H.num(12),text:'That is the adult ticket. The question asks for the child ticket, c.'},{when:(r,H)=>H.num(21),text:'21 is what the two tickets cost together. Divide it between c and (4/3)c: (7/3)c = 21.'}],...G('Combine c + (4/3)c = (7/3)c, subtract 5.50, then divide.','(7/3)c = 21 → c = 9.','Subtract 5.50: (7/3)c = 21.')},
  {id:'q21c',p:2,skill:'linear',learn:2,kind:'num',work:false,prompt:'<b>21 (continued).</b> What is the <b>adult</b> ticket price (dollars)?',answer:'12',unit:'$',placeholder:'e.g. 12',hints:[{when:(r,H)=>H.num(9),text:'That is the child ticket. The adult ticket is 4/3 of it.'}],...G('Adult = (4/3) × child.','(4/3)(9) = 12.','Multiply the child price by 4/3.')},
  {id:'q22a',p:3,skill:'both',learn:3,kind:'choice',explain:true,work:false,prompt:'<b>22. Error Analysis.</b> A student solved <span class="eq">0.6(y − 0.2) = 3 − 0.2(y − 1)</span> like this:<div class="students"><div>0.6y − 0.12 = 3.2 − 0.2y</div><div>100(0.6y − 0.12) = 10(3.2 − 0.2y)</div><div>60y − 12 = 32 − 2y</div><div>62y = 42, so y = 21/31</div></div>Which statement describes the error?',options:['In the second line the left side was multiplied by 100 but the right side by 10. Both sides must be multiplied by the same number.','The first line is wrong: −0.2(y − 1) should be −0.2y − 0.2.','The student should have subtracted 3 from both sides before distributing.','There is no error; y = 21/31 is correct.'],correct:[0],rubric:'The two sides were multiplied by different numbers (100 and 10). Multiplying both sides by 100 gives 60y − 12 = 320 − 20y, so 80y = 332 and y = 4.15.',hints:[],...G('Check each line against the one before it: what was done to each side?','Line 2 does something different to the two sides. Equality only survives the same move on both.','Compare what happened to the left side and the right side in line 2.')},
  {id:'q22b',p:3,skill:'both',learn:3,kind:'num',work:true,prompt:'<b>22 (continued).</b> Solve the equation correctly: <span class="eq">0.6(y − 0.2) = 3 − 0.2(y − 1)</span>.',answer:'4.15',placeholder:'y = …',hints:[{when:(r,H)=>H.num(21/31),text:'That is the student\'s wrong answer. Multiply both sides by the same number (100, or just work in decimals).'},{when:(r,H)=>H.num(3.6)||H.num(3.35),text:'Distribute carefully on the right: 3 − 0.2(y − 1) = 3 − 0.2y + 0.2 = 3.2 − 0.2y.'}],...G('Distribute both sides: 0.6y − 0.12 = 3.2 − 0.2y. Add 0.2y, add 0.12, divide by 0.8.','0.8y = 3.32 → y = 4.15.','0.6y − 0.12 = 3.2 − 0.2y.')},
  {id:'q23',p:3,skill:'both',learn:3,kind:'num',work:true,prompt:'<b>23.</b> Solve <span class="eq">21 − 4x = 4x + 21</span>.',answer:'0',placeholder:'x = …',hints:[{when:(r,H)=>H.has(/no solution|none/i),text:'There is a solution. Collect the x terms: 21 = 8x + 21. What is 8x?'},{when:(r,H)=>H.num(42/8)||H.num(5.25),text:'The 21s are on both sides; moving one cancels the other. What is left for 8x?'}],...G('Add 4x to both sides, then subtract 21.','21 = 8x + 21 → 0 = 8x.','Add 4x to both sides: 21 = 8x + 21.')},
  {id:'q24',p:3,skill:'both',learn:3,kind:'num',work:true,prompt:'<b>24.</b> Solve <span class="eq">6b − 27 = 3(5b − 2)</span>.',answer:'-7/3',placeholder:'b = … (fraction)',hints:[{when:(r,H)=>H.num(7/3),text:'Sign check: 6b − 15b = −9b, and −27 + 6 = −21. So −9b = −21… or 9b = −21 if you moved the other way.'},{when:(r,H)=>H.num(-25/9)||H.num(25/9),text:'Distribute the 3 to both terms: 15b − 6, not 15b − 2.'}],...G('Distribute the 3, collect b terms on one side, constants on the other.','6b − 27 = 15b − 6 → −21 = 9b.','Distribute: 15b − 6.')},
  {id:'q25',p:3,skill:'both',learn:3,kind:'num',work:true,prompt:'<b>25.</b> Solve <span class="eq">0.45(t + 8) = 0.6(t − 3)</span>.',answer:'36',placeholder:'t = …',hints:[{when:(r,H)=>H.num(12),text:'0.45 × 8 = 3.6 and 0.6 × 3 = 1.8. Collect: 3.6 + 1.8 = 0.15t.'},{when:(r,H)=>H.num(-36),text:'Sign slip. 0.45t + 3.6 = 0.6t − 1.8 → 5.4 = 0.15t.'}],...G('Distribute both sides, collect t on the side where it stays positive.','5.4 = 0.15t → t = 36.','0.45t + 3.6 = 0.6t − 1.8.')},
  {id:'q26a',p:3,skill:'both',learn:3,kind:'choice',explain:true,work:false,prompt:'<b>26. Communicate and Justify.</b> Izaak can join a gym that charges <b>$19.99 per month plus an annual $12.80 fee</b>, or pay <b>$21.59 per month</b>. He thinks the second option is better because he plans to use the gym for <b>10 months</b>. Is Izaak correct?',options:['No. For 10 months, option 1 costs 19.99(10) + 12.80 = $212.70 and option 2 costs 21.59(10) = $215.90, so option 1 is cheaper.','Yes. Option 2 has no annual fee, so it is always cheaper.','Yes. $21.59 − $19.99 is only $1.60, which is less than the fee.','Both options cost the same for 10 months.'],correct:[0],rubric:'Izaak is incorrect. Option 1 for 10 months: 19.99 × 10 + 12.80 = 212.70. Option 2: 21.59 × 10 = 215.90. Option 1 is $3.20 cheaper. The plans cost the same at 8 months (19.99m + 12.80 = 21.59m gives m = 8), so beyond 8 months option 1 wins.',hints:[],...G('Compute both totals for 10 months before deciding.','19.99(10) + 12.80 versus 21.59(10).','Option 1 total = 19.99(10) + 12.80.')},
  {id:'q26b',p:3,skill:'both',learn:3,kind:'num',work:true,prompt:'<b>26 (continued).</b> After how many months do the two options cost the same? Solve <span class="eq">19.99m + 12.80 = 21.59m</span>.',answer:'8',unit:'months',placeholder:'months',hints:[{when:(r,H)=>H.num(12.8/1.6*2)||H.num(4),text:'Subtract 19.99m from both sides: 12.80 = 1.60m.'}],...G('Collect m terms: 12.80 = 1.60m.','m = 12.80 ÷ 1.60.','Subtract 19.99m from both sides.')},
  {id:'q27a',p:4,skill:'literal',learn:4,kind:'choice',explain:true,work:false,prompt:`<b>27. Error Analysis.</b> A student solved <span class="eq">a = ¾(b + 5)</span> for b:<div class="students"><div>${fr('4','3')}a = ${fr('3','4')}(b + 5) · ${fr('4','3')}</div><div>${fr('4','3')}a = b + 5</div><div>b = ${fr('4','3')}a + 5</div></div>Which statement describes the error?`,options:['In the last step the student added 5 instead of subtracting 5. To undo + 5, subtract 5 from both sides: b = (4/3)a − 5.','The student should have divided by 4/3 instead of multiplying by 4/3.','The 4/3 should have been distributed to b and to 5.','The second line is wrong because (4/3)(3/4) is not 1.'],correct:[0],rubric:'The last step added 5 instead of subtracting it. From (4/3)a = b + 5, subtract 5 from both sides: b = (4/3)a − 5.',hints:[],...G('Check the last move: + 5 is attached to b. What undoes adding 5?','Subtract 5 from both sides, not add.','What is attached to b in line 2?')},
  {id:'q27b',p:4,skill:'literal',learn:4,kind:'expr',var:'b',work:false,prompt:'<b>27 (continued).</b> Write the correct solution for <i>b</i>.',answer:'4a/3-5',placeholder:'b = …',hints:[{when:(r,H)=>H.expr('4a/3+5'),text:'That is the student\'s answer. Undo + 5 by subtracting.'},{when:(r,H)=>H.expr('3a/4-5'),text:'To undo multiplying by ¾, multiply by 4/3 (or divide by ¾).'}],...G('Multiply by 4/3 to clear the ¾, then subtract 5.','b = (4/3)a − 5.','Multiply both sides by 4/3.')},
  {id:'q28',p:4,skill:'literal',learn:4,kind:'expr',var:'y',work:false,prompt:'<b>28.</b> Solve <span class="eq">xy = k</span> for <i>y</i>.',answer:'k/x',placeholder:'y = …',hints:[{when:(r,H)=>H.expr('k-x'),text:'x is multiplying y, not added. What undoes multiplying by x?'},{when:(r,H)=>H.expr('x/k'),text:'Divide both sides by x, so k ends up on top.'}],...G('y is being multiplied by x. Divide both sides by x.','y = k/x.','Divide both sides by x.')},
  {id:'q29',p:4,skill:'literal',learn:4,kind:'expr',var:'c',work:true,prompt:`<b>29.</b> Solve <span class="eq">a = ${fr('2','b')} + 3c</span> for <i>c</i>.`,answer:'(a-2/b)/3',placeholder:'c = …',hints:[{when:(r,H)=>H.expr('(a-2)/(3b)')||H.expr('(a-2)/3'),text:'2/b is one term. Subtract the whole 2/b from both sides, then divide everything by 3.'},{when:(r,H)=>H.expr('a/3-2/b'),text:'Dividing by 3 has to reach both a and 2/b: a/3 − 2/(3b).'}],...G('Subtract 2/b from both sides, then divide the whole side by 3.','c = (a − 2/b)/3, also written a/3 − 2/(3b).','Subtract 2/b from both sides.')},
  {id:'q30',p:4,skill:'literal',learn:4,kind:'expr',var:'d',work:true,prompt:'<b>30.</b> Solve <span class="eq">6(2c + 3d) = 5(4c − 3d)</span> for <i>d</i>.',answer:'8c/33',placeholder:'d = …',hints:[{when:(r,H)=>H.expr('8c/3')||H.expr('8c/18'),text:'Collect the d terms: 18d + 15d = 33d. Then 33d = 8c.'},{when:(r,H)=>H.expr('-8c/33')||H.expr('32c/33'),text:'Distribute: 12c + 18d = 20c − 15d. Move 12c right: 20c − 12c = 8c.'}],...G('Distribute both sides, collect d terms on one side (they add up), collect c terms on the other.','33d = 8c → d = 8c/33.','Distribute: 12c + 18d = 20c − 15d.')},
  {id:'q31a',p:4,skill:'literal',learn:4,kind:'expr',var:'f',work:true,prompt:'<b>31. Model With Mathematics.</b> Average acceleration is <span class="eq">a = (V<sub>f</sub> − V<sub>i</sub>) / t</span>, where V<sub>f</sub> is final velocity, V<sub>i</sub> is initial velocity, and t is time. Rewrite as a formula for V<sub>f</sub>. <span class="muted">(Type V<sub>f</sub> as <b>f</b> and V<sub>i</sub> as <b>i</b>.)</span>',answer:'at+i',placeholder:'f = …',hints:[{when:(r,H)=>H.expr('at-i'),text:'V_i is subtracted inside. What undoes subtracting V_i?'},{when:(r,H)=>H.expr('a/t+i')||H.expr('(a+i)/t'),text:'The whole top is divided by t. Multiply both sides by t first.'}],...G('Multiply both sides by t, then add V_i.','V_f = at + V_i.','Multiply both sides by t: at = V_f − V_i.')},
  {id:'q31b',p:4,skill:'literal',learn:4,kind:'num',work:true,prompt:'<b>31 (continued).</b> What is the final velocity when a person accelerates at 2 ft/s² for 5 seconds after an initial velocity of 4 ft/s? (ft/s)',answer:'14',unit:'ft/s',placeholder:'ft/s',hints:[{when:(r,H)=>H.num(10),text:'2 × 5 = 10 is the change in velocity. Add the starting velocity.'},{when:(r,H)=>H.num(11)||H.num(6),text:'V_f = a·t + V_i = 2(5) + 4.'}],...G('Plug into V_f = at + V_i.','2(5) + 4 = 14.','V_f = 2 × 5 + 4.')},
  {id:'q32',p:5,skill:'ineq',learn:5,kind:'rel',solved:'x',work:false,prompt:'<b>32. Use Structure.</b> Write an inequality that represents the graph.'+nlSVG({min:-5,max:5,lo:-1,hi:3,loOpen:false,hiOpen:false,alt:'closed circles at −1 and 3, shaded between'}),answer:'-1<=x<=3',placeholder:'e.g. −1 ≤ x ≤ 3',hints:[{when:(r,H)=>H.rel('-1<x<3'),text:'The circles are filled. A filled circle means that number counts. Which symbol includes equal?'},{when:(r,H)=>H.rel('x<=3')||H.rel('x>=-1'),text:'The shading stops at both ends, so there are two conditions. Write both in one compound inequality.'}],...G('Read the two endpoints, decide open or closed, and whether the shading is between or outside.','Closed circles mean ≤. Shaded between means −1 ≤ x ≤ 3.','Endpoints: −1 and 3, both closed.')},
  {id:'q33',p:5,skill:'ineq',learn:5,kind:'rel',solved:'x',work:true,prompt:'<b>33.</b> Solve <span class="eq">x + 8 > 11</span>.',answer:'x>3',placeholder:'x > …',hints:[{when:(r,H)=>H.rel('x<3'),text:'Subtracting 8 is not a negative multiply, so the symbol does not flip.'},{when:(r,H)=>H.rel('x>19'),text:'Undo + 8 by subtracting 8 from both sides.'}],...G('Subtract 8 from both sides.','x > 3.','Subtract 8 from both sides.')},
  {id:'q33g',p:5,skill:'ineq',learn:5,kind:'numberline',work:false,prompt:'<b>33 (graph).</b> Graph <span class="eq">x > 3</span>. Choose the shape, place the circle, tap it for open or closed.',nl:{min:-2,max:8,lo:3,loOpen:true,shape:'right',chooseShape:true},hints:[{when:(r,H)=>H.nl&&H.nl.shape!=='right',text:'x > 3 means every number bigger than 3: one ray heading right.'},{when:(r,H)=>H.nl&&!H.nl.loOpen,text:'Strict symbol, so 3 itself is not included: open circle.'}],...G('Pick the ray that points toward bigger numbers. Strict means open.','Right ray from an open circle at 3.','Choose "Right ray".')},
  {id:'q34',p:5,skill:'ineq',learn:5,kind:'rel',solved:'x',work:true,prompt:'<b>34.</b> Solve <span class="eq">4x + 3 ≤ −6</span>.',answer:'x<=-9/4',placeholder:'x ≤ … (fraction or decimal)',hints:[{when:(r,H)=>H.rel('x>=-9/4'),text:'Dividing by positive 4 does not flip the symbol.'},{when:(r,H)=>H.rel('x<=-3/4'),text:'Subtract 3 from both sides first: 4x ≤ −9.'}],...G('Subtract 3, then divide by 4 (positive, no flip).','4x ≤ −9 → x ≤ −9/4 = −2.25.','Subtract 3: 4x ≤ −9.')},
  {id:'q34g',p:5,skill:'ineq',learn:5,kind:'numberline',work:false,prompt:'<b>34 (graph).</b> Graph <span class="eq">x ≤ −2.25</span>. (The circle snaps to quarters.)',nl:{min:-5,max:1,lo:-2.25,loOpen:false,shape:'left',chooseShape:true,step:0.25},hints:[{when:(r,H)=>H.nl&&H.nl.shape!=='left',text:'x ≤ −2.25 means −2.25 and everything smaller: a ray heading left.'},{when:(r,H)=>H.nl&&H.nl.loOpen,text:'≤ includes the endpoint: closed circle.'}],...G('Left ray, closed circle, at −2.25 (a quarter past −2 toward −3).','Left ray from a closed circle at −2.25.','Choose "Left ray".')},
  {id:'q35',p:5,skill:'ineq',learn:5,kind:'rel',solved:'x',work:true,prompt:'<b>35.</b> Solve <span class="eq">2.4x − 9 < 1.8x + 6</span>.',answer:'x<25',placeholder:'x < …',hints:[{when:(r,H)=>H.rel('x>25'),text:'Subtract 1.8x (keeps x positive): 0.6x − 9 < 6. No flip needed.'},{when:(r,H)=>H.rel('x<-5')||H.rel('x<5'),text:'0.6x < 15. Divide by 0.6.'}],...G('Collect x on the left (subtract 1.8x), add 9, divide by 0.6.','0.6x < 15 → x < 25.','Subtract 1.8x: 0.6x − 9 < 6.')},
  {id:'q35g',p:5,skill:'ineq',learn:5,kind:'numberline',work:false,prompt:'<b>35 (graph).</b> Graph <span class="eq">x < 25</span>.',nl:{min:20,max:30,lo:25,loOpen:true,shape:'left',chooseShape:true},hints:[{when:(r,H)=>H.nl&&H.nl.shape!=='left',text:'Less than 25: the ray heads left.'},{when:(r,H)=>H.nl&&!H.nl.loOpen,text:'Strict: open circle at 25.'}],...G('Left ray, open circle at 25.','Left ray from an open circle at 25.','Choose "Left ray".')},

  const pet={slime:`<g transform="translate(34,30)"><rect x="0" y="4" width="12" height="10" fill="#5bc236" stroke="#1d2733" stroke-width="2"/><rect x="3" y="7" width="2" height="2" fill="#1d2733"/><rect x="7" y="7" width="2" height="2" fill="#1d2733"/></g>`,
    cat:`<g transform="translate(34,28)"><polygon points="1,4 1,0 4,3" fill="#f0a35e" stroke="#1d2733" stroke-width="1"/><polygon points="11,4 11,0 8,3" fill="#f0a35e" stroke="#1d2733" stroke-width="1"/><rect x="0" y="3" width="12" height="13" fill="#f0a35e" stroke="#1d2733" stroke-width="2"/><rect x="3" y="7" width="2" height="2" fill="#1d2733"/><rect x="7" y="7" width="2" height="2" fill="#1d2733"/></g>`,
    bee:`<g transform="translate(34,18)"><rect x="0" y="2" width="12" height="8" fill="#f5b800" stroke="#1d2733" stroke-width="2"/><rect x="4" y="2" width="2" height="8" fill="#1d2733"/><rect x="8" y="2" width="2" height="8" fill="#1d2733"/><ellipse cx="6" cy="0" rx="5" ry="2" fill="#cfe6ff" stroke="#1d2733" stroke-width="1"/></g>`,
    ghost:`<g transform="translate(34,22)"><path d="M0 6 Q0 0 6 0 Q12 0 12 6 V16 L9 13 L6 16 L3 13 L0 16 Z" fill="#eef2f7" stroke="#1d2733" stroke-width="2"/><rect x="3" y="5" width="2" height="2" fill="#1d2733"/><rect x="7" y="5" width="2" height="2" fill="#1d2733"/></g>`}[av.pet]||'';
  return `<svg viewBox="-2 -12 50 58" aria-hidden="true" style="overflow:visible"><rect x="7" y="2" width="20" height="18" fill="#f3c08a" stroke="#1d2733" stroke-width="3"/><rect x="7" y="2" width="20" height="6" fill="#5a3b1e"/>${hat}<rect x="12" y="10" width="3" height="3" fill="#1d2733"/><rect x="20" y="10" width="3" height="3" fill="#1d2733"/><rect x="13" y="15" width="8" height="2" fill="#1d2733"/><rect x="5" y="21" width="24" height="14" fill="${shirt}" stroke="#1d2733" stroke-width="3"/><rect x="1" y="21" width="4" height="12" fill="#f3c08a" stroke="#1d2733" stroke-width="2"/><rect x="29" y="21" width="4" height="12" fill="#f3c08a" stroke="#1d2733" stroke-width="2"/><rect x="7" y="35" width="8" height="9" fill="#3a56a8" stroke="#1d2733" stroke-width="2"/><rect x="19" y="35" width="8" height="9" fill="#3a56a8" stroke="#1d2733" stroke-width="2"/>${pet}</svg>`;
}
VIEWS.shop=(app)=>{
  const owned=new Set(State.s.owned||[]); const av=State.s.avatar; const cats=['Shirt','Hat','Pet'];
  const equipped=id=>{ const [k,v]=id.split(':'); return av[k]===v; };
  app.innerHTML=h`<div class="stack">
   <div class="block"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">Coin shop</p><h1>Dress your block.</h1></div><button class="btn alt sm" data-go="map">🗺 Map</button></div><p class="muted" style="margin-top:6px">Looks only. No gear changes the math. Coins come from checkpoints, correct answers, and boss runs.</p>
    <div class="row" style="margin-top:14px;align-items:flex-end"><div class="avprev">${avatarSVG(av)}</div><div><div class="pill coins" style="font-size:1.1rem"><span class="coin"></span><span class="num">${State.s.coins}</span> coins</div><p class="muted" style="font-size:.85rem;margin-top:6px">Tap an owned item to wear it. Tap it again to take it off.</p></div></div></div>
   ${cats.map(c=>`<div class="block"><h2>${c}s</h2><div class="shopgrid">${(c==='Shirt'?[{id:'skin:green',cat:'Shirt',name:'Grass shirt',price:0,ico:'👕'}]:[{id:(c==='Hat'?'hat':'pet')+':none',cat:c,name:'None',price:0,ico:'∅'}]).concat(SHOP.filter(s=>s.cat===c)).map(s=>{ const own=s.price===0||owned.has(s.id); const eq=equipped(s.id); return `<button type="button" class="shopitem ${own?'own':''} ${eq?'eq':''}" data-id="${s.id}" data-price="${s.price}" ${!own&&State.s.coins<s.price?'disabled':''}><span class="ico">${s.ico}</span><b>${esc(s.name)}</b><span class="muted num">${own?(eq?'wearing':'owned'):s.price+' coins'}</span></button>`; }).join('')}</div></div>`).join('')}
  </div>`;
  app.querySelectorAll('.shopitem').forEach(b=>b.onclick=()=>{ const id=b.dataset.id, price=+b.dataset.price; const [k,v]=id.split(':'); const own=price===0||owned.has(id);
    if(!own){ if(State.s.coins<price) return; modal(`<h2>Buy ${esc(SHOP.find(s=>s.id===id).name)} for ${price} coins?</h2><p class="muted">You have ${State.s.coins}.</p>`,[{label:'Not now',cls:'alt'},{label:'Buy and wear',cls:'gold',fn:()=>{ State.s.coins-=price; (State.s.owned=State.s.owned||[]).push(id); av[k]=v; State.save(); ding(); toast('Bought. Looking sharp.'); render(); }}]); return; }
    av[k]= (av[k]===v && v!=='none' && k!=='skin') ? 'none' : v; State.save(); render(); });
};

/* ---- Journal: every correct answer with his notes, across units ---- */
function journalEntries(){
  const out=[]; for(const uid in UNITS){ const u=UNITS[uid]; const st=US(uid);
    u.ITEMS.forEach(it=>{ const r=st.checks[it.id]; if(r&&r.correct) out.push({unit:u,section:'Check',lesson:(u.PROBLEMS.find(P=>P.n===it.p)||{}),id:it.id,prompt:it.prompt,answer:r.answer||'',work:r.work||'',ts:r.clearedAt||0}); });
    u.LEVELS.forEach(L=>{ const l=st.learn['l'+L.n]||{}; (u.MINI[L.n]||[]).forEach((q,i)=>{ const key='q'+(i+1); if(l[key]) out.push({unit:u,section:'Level '+L.n+' mini-boss',lesson:{title:L.title},id:'L'+L.n+'Q'+(i+1),prompt:q.prompt,answer:l['a'+key]||'✔',work:l['w'+key]||'',ts:l[key]}); }); });
    st.attempts.forEach(a=>(a.items||[]).forEach(x=>{ if(x.ok) out.push({unit:u,section:'Final Boss run '+a.seed,lesson:{title:new Date(a.ts).toLocaleDateString()},id:x.id,prompt:'',answer:x.raw,work:x.work||'',ts:a.ts}); })); }
  return out;
}
let journalUnit='all';
VIEWS.journal=(app)=>{
  const all=journalEntries(); const es=all.filter(e=>journalUnit==='all'||e.unit.id===journalUnit); const groups={};
  es.forEach(e=>{ const k=e.unit.title+' · '+e.section; (groups[k]=groups[k]||[]).push(e); });
  app.innerHTML=h`<div class="stack">
   <div class="block"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">Journal</p><h1>Everything you have solved.</h1></div><button class="btn alt sm" data-go="map">🗺 Map</button></div><p class="muted" style="margin-top:6px">Every correct answer is kept here with your notes, so you can look back at how you did it. ${State.mode==='signed'?'':'On a public link this lasts only while the page is open.'}</p>
    <div class="row" style="margin-top:10px"><button class="tab" data-ju="all" aria-current="${journalUnit==='all'?'page':'false'}">All</button>${Object.values(UNITS).map(u=>`<button class="tab" data-ju="${u.id}" aria-current="${journalUnit===u.id?'page':'false'}">${esc(u.short)}</button>`).join('')}<span class="muted num" style="margin-left:auto">${es.length} entr${es.length===1?'y':'ies'}</span></div></div>
   ${es.length?Object.keys(groups).map(k=>`<div class="block"><h2>${esc(k)}</h2><div class="stack" style="margin-top:10px">${groups[k].sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(e=>`<div class="jentry"><div class="tag">${esc(String(e.id).toUpperCase())}${e.lesson.title?` <span class="muted" style="font-family:var(--body);font-size:.8rem;font-weight:700">· ${esc(e.lesson.title)}</span>`:''}</div>${e.prompt?`<div style="font-size:.95rem">${e.prompt}</div>`:''}<div><span class="muted">Answer:</span> <span class="eq" style="white-space:normal">${esc(e.answer)}</span></div>${e.work?`<div class="workbox">${esc(e.work)}</div>`:'<div class="muted" style="font-size:.85rem">No notes written for this one.</div>'}</div>`).join('')}</div></div>`).join(''):'<div class="block soft"><p>Nothing solved yet. Clear a Check item, a mini-boss, or a Final Boss question and it lands here with your notes.</p></div>'}
  </div>`;
  app.querySelectorAll('[data-ju]').forEach(b=>b.onclick=()=>{ journalUnit=b.dataset.ju; render(); });
};

/* ---- Rematch Chest: spaced retrieval of past misses, fresh numbers, once a day ---- */
function missedIds(){ const out=[]; for(const uid in UNITS){ const st=US(uid); for(const id in st.checks){ const r=st.checks[id]; if(r.history&&r.history.some(x=>!x.ok)) out.push(uid+':'+id); } st.attempts.forEach(a=>(a.items||[]).forEach(x=>{ if(!x.ok) out.push(uid+':'+x.id); })); } return [...new Set(out)]; }
function chestToday(){ const today=localDay(0); let c=State.s.chest; const seed=parseInt(today.replace(/-/g,''),10)%100000;
  if(!c||c.date!==today) c=State.s.chest={date:today,seed,ids:[],done:{}};
  // Top the chest up to 5 open rematches from misses it does not hold yet (new misses can appear during the day).
  const open=c.ids.filter(id=>!c.done[id]).length; if(open<5){ const pool=missedIds().filter(id=>!c.ids.includes(id)); if(pool.length){ const r=M.rng(seed+c.ids.length); const add=[...pool].sort(()=>r()-0.5).slice(0,5-open); c.ids.push(...add); State.save(); } }
  return c; }
function chestCount(){ const c=chestToday(); return c.ids.filter(id=>!c.done[id]).length; }
VIEWS.chest=(app)=>{
  const c=chestToday(); const tests={}; const items=c.ids.map(key=>{ const [uid,id]=key.split(':'); const u=UNITS[uid]; if(!u) return null; tests[uid]=tests[uid]||u.genTest(c.seed); const it=tests[uid].items.find(x=>x.id===id); return it?{key,uid,it}:null; }).filter(Boolean);
  const left=items.filter(x=>!c.done[x.key]).length;
  app.innerHTML=h`<div class="stack">
   <div class="block" style="border-color:var(--gold)"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">Rematch Chest</p><h1>${items.length?(left?'Old enemies, new numbers.':'Chest emptied for today.'):'The chest is empty.'}</h1></div><button class="btn alt sm" data-go="map">🗺 Map</button></div>
    <p class="muted" style="margin-top:6px">${items.length?'Questions you missed before come back here with fresh numbers. 15 coins each, and beating one is the best way to make it stick. A new chest appears each day.':'It fills with questions you have missed in Check or the Final Boss. No misses yet means nothing to rematch. Come back after a boss run.'}</p></div>
   ${items.map(({key,uid,it})=>`<div class="item ${c.done[key]?'ok':''}" data-item="${it.id}" data-key="${key}"><div class="tag">${esc(UNITS[uid].short)} · ${it.id.toUpperCase()} ${c.done[key]?'<span class="ck">✔ beaten</span>':''}</div><div>${it.prompt}</div><label class="muted" style="font-size:.85rem">Work it out here</label><textarea class="scratch" placeholder="Steps, scribbles, anything."></textarea>${answerUI(it,'ch')}<div class="row"><button type="button" class="btn sm check" ${c.done[key]?'disabled':''}>Check</button></div><div class="fbwrap"></div></div>`).join('')}
  </div>`;
  items.forEach(({key,uid,it})=>{ const el=app.querySelector(`[data-key="${key}"]`); wireAnswerUI(it,el); let misses=0; $('.check',el).onclick=()=>{ const raw=rawOf(it,el).trim(); if(!raw&&it.kind!=='numberline'){ showFB(el,'info','Type something first.'); return; } const extra=it.kind==='numberline'?el._nl.get():null; const g=gradeItem(it,raw,extra);
      if(g.ok){ el.classList.add('ok'); el.classList.remove('bad'); c.done[key]=Date.now(); State.addCoins(15,'rematch won'); State.checkpoint(); showFB(el,'ok','Rematch won. That one is yours now.'); $('.check',el).disabled=true; $('.tag',el).innerHTML+=' <span class="ck">✔ beaten</span>'; State.save(); }
      else { misses++; thud(); el.classList.add('bad'); const why=diagnose(it,raw,extra)||it.diag; showFB(el,'bad',`<span class="who">Respawn</span>${g.partial?g.partial+' ':''}${esc(why)}${misses>=2?`<br><span class="muted">Correct form: ${esc(it.show)}</span>`:''}<br>${learnLinkFor(uid,it.learn)}`); } }; });
};
function learnLinkFor(uid,n){ const L=UNITS[uid].LEVELS[n-1]; return `<a href="#" data-gounit="${uid}" data-level="${n}">→ ${esc(UNITS[uid].short)} Level ${n}: ${esc(L.title)}</a>`; }
document.addEventListener('click',e=>{ const a=e.target.closest('[data-gounit]'); if(a){ e.preventDefault(); State.unit=a.dataset.gounit; go('level',+a.dataset.level); } });

/* ---- Read-aloud: pre-rendered clip when one exists, browser speech as a fallback ---- */
let raAudio=null;
function raButton(key,text){ return `<button type="button" class="ra" data-ra="${esc(key)}" data-text="${esc(text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}" aria-label="Read aloud" title="Read aloud">🔊</button>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('.ra'); if(!b) return; if(State.s.muted){ toast('Sound is off. Turn it on from the map.'); return; }
  try{ if(raAudio){ raAudio.pause(); } if(window.speechSynthesis) speechSynthesis.cancel(); }catch(x){}
  const key=b.dataset.ra, text=b.dataset.text; const a=new Audio('voices/ra/'+key+'.mp3'); raAudio=a; b.classList.add('on'); a.onended=()=>b.classList.remove('on');
  a.onerror=()=>{ try{ if(!window.speechSynthesis){ b.classList.remove('on'); return; } const u=new SpeechSynthesisUtterance(text.replace(/≤/g,' less than or equal to ').replace(/≥/g,' greater than or equal to ').replace(/</g,' less than ').replace(/>/g,' greater than ').replace(/−/g,' minus ')); u.rate=1; u.onend=()=>b.classList.remove('on'); speechSynthesis.speak(u);}catch(x){ b.classList.remove('on'); } };
  a.play().catch(()=>a.onerror()); });
/* ===== Boot ===== */
function routeFromHash(){ const hsh=(location.hash||'').replace('#',''); if(hsh==='guide') return {view:'map',arg:null,gate:true};
  if(['map','journal','shop','chest'].includes(hsh)) return {view:hsh,arg:null};
  let m=hsh.match(/^(u[0-9a-z]+)(?:-(hub|learn|check|boss|level([1-6])))?$/); if(m&&UNITS[m[1]]){ State.unit=m[1]; const v=m[2]||'hub'; return v.startsWith('level')?{view:'level',arg:+m[3]}:{view:v,arg:null}; }
  m=hsh.match(/^level([1-6])$/); if(m) return {view:'level',arg:+m[1]}; if(['check','boss','learn','lobby','hub'].includes(hsh)) return {view:hsh==='lobby'?'hub':hsh,arg:null}; return {view:'map',arg:null}; }
/* Older profiles kept learn/checks/attempts at the top level; move them under units.u1. */
function migrate(s){ if(!s.units) s.units={}; if(s.learn||s.checks||s.attempts){ const u=s.units.u1||(s.units.u1={learn:{},checks:{},attempts:[]}); Object.assign(u.learn,s.learn||{}); Object.assign(u.checks,s.checks||{}); u.attempts=[...(u.attempts||[]),...(s.attempts||[])]; delete s.learn; delete s.checks; delete s.attempts; } for(const k in s.units){ const u=s.units[k]; u.learn=u.learn||{}; u.checks=u.checks||{}; u.attempts=u.attempts||[]; } if(!s.avatar) s.avatar={skin:'green',hat:'none',pet:'none'}; if(!s.owned) s.owned=[]; if(!s.chest) s.chest={}; return s; }
function start(hot){
  if(hot&&hot.s){ State.s=Object.assign(State.s,hot.s); State.unlocked=!!hot.unlocked; if(hot.unit&&UNITS[hot.unit]) State.unit=hot.unit; } migrate(State.s);
  const r=routeFromHash(); route={view:r.view,arg:r.arg}; if(hot&&hot.route&&!location.hash) route=hot.route;
  render(); if(r.gate) openGate();
  $('#logoBtn').onclick=()=>go('map'); $('#glyph').onclick=openGate;
  // Full screen: optional, desktop browsers mostly; hidden where the browser refuses it.
  const fsb=$('#fsBtn'); const root=document.documentElement;
  if(document.fullscreenEnabled&&root.requestFullscreen){ fsb.hidden=false; fsb.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else root.requestFullscreen().catch(()=>{ fsb.hidden=true; }); };
    document.addEventListener('fullscreenchange',()=>{ fsb.textContent=document.fullscreenElement?'⛶':'⛶'; fsb.title=document.fullscreenElement?'Exit full screen':'Full screen'; fsb.setAttribute('aria-label',fsb.title); }); }
  try{ window.claude?.hot?.snapshot?.(()=>({s:State.s, route, unlocked:State.unlocked, unit:State.unit})); }catch(e){}
  connect();
  window.addEventListener('hashchange',()=>{ const r=routeFromHash(); route={view:r.view,arg:r.arg}; render(); if(r.gate) openGate(); });
}
async function connect(){
  if(!window.claude||typeof window.claude.use!=='function'){ State.ready=true; return; }
  try{
    const [user,db,sample]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('sample')]);
    State.sample=sample||null;
    if(user&&db){ const uid=await user.id(); if(uid){ State.uid=uid; State.db=db; State.mode='signed'; await loadProfile(); } }
  }catch(e){ console.warn('capabilities',e); }
  State.ready=true;
  // Re-render data views; leave an in-progress level alone unless the merge changed it.
  if(route.view!=='level'||State.learnChanged) render(); else renderHUD();
}
/* Merge the stored profile INTO the live objects (never replace them: open views hold references),
   and keep anything earned before the store answered. */
async function loadProfile(){
  try{
    const doc=State.db.doc('data/users/'+State.uid+'/profile'); const snap=await doc.get();
    const before=JSON.stringify(State.s.units);
    if(snap.exists){ const d=migrate(snap.data()||{}); const S=State.s;
      S.coins=(d.coins||0)+(State.earned||0);
      Object.assign(S.badges, d.badges||{}); if(d.avatar) S.avatar=Object.assign(S.avatar||{},d.avatar); if(d.owned) S.owned=[...new Set([...(S.owned||[]),...d.owned])]; if(d.chest) S.chest=Object.assign(d.chest, S.chest||{});
      for(const uid in d.units){ const du=d.units[uid]; const su=US(uid);
        for(const id in (du.checks||{})){ const st=du.checks[id], lo=su.checks[id]; if(!lo||!lo.attempts) su.checks[id]=st; else { su.checks[id]={...st,...lo, attempts:(st.attempts||0)+(lo.attempts||0), correct:!!(st.correct||lo.correct), firstTry:!!(st.firstTry||lo.firstTry), history:[...(st.history||[]),...(lo.history||[])].slice(-25), work:lo.work||st.work}; } }
        for(const l in (du.learn||{})){ su.learn[l]=Object.assign(su.learn[l]||{}, du.learn[l], su.learn[l]||{}); } }
      if(d.daily){ const lo=S.daily; if(!lo||lo.date!==d.daily.date) S.daily=lo&&lo.date>d.daily.date?lo:d.daily; else S.daily={...d.daily, count:Math.max(lo.count||0,d.daily.count||0), streak:Math.max(lo.streak||0,d.daily.streak||0), lastMet:lo.lastMet||d.daily.lastMet}; }
      if(d.muted!==undefined) S.muted=d.muted; if(d.voice!==undefined) S.voice=d.voice;
    }
    const q=await doc.collection('attempts').orderBy('ts','desc').limit(100).get(); const stored=q.docs.map(x=>x.data()); const ids=new Set(stored.map(a=>a.id));
    for(const uid in State.s.units){ US(uid).attempts=US(uid).attempts.filter(a=>!ids.has(a.id)); } stored.forEach(a=>US(a.unit||'u1').attempts.push(a));
    if(State.earned||before!==JSON.stringify(State.s.units)) State.save();
    State.learnChanged = before!==JSON.stringify(State.s.units);
  }catch(e){ console.warn('load',e); }
}
async function saveAttempt(a){ US(a.unit||State.unit).attempts.unshift(a); if(!State.db||!State.uid) return; try{ await State.db.doc('data/users/'+State.uid+'/profile').collection('attempts').doc(a.id).set(a); }catch(e){ console.warn('attempt save',e); } }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
